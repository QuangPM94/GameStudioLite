name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate canonical framework state
        run: studio validate

      - name: Render reports
        run: studio report

      - name: Check patch whitespace
        run: git diff --check

      - name: Smoke read-only CLI commands in a copied repository
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("pgs-cli-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE |
            Copy-Item -Destination $smokeRoot -Recurse -Force
          Push-Location $smokeRoot
          try {
            studio criterion list
            if ($LASTEXITCODE -ne 0) {
              throw "studio criterion list failed with exit code $LASTEXITCODE"
            }
            studio dependency list
            if ($LASTEXITCODE -ne 0) {
              throw "studio dependency list failed with exit code $LASTEXITCODE"
            }
            studio path check
            if ($LASTEXITCODE -ne 0) {
              throw "studio path check failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }
